[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phase7-weather-api"
version = "0.2.0"
description = "FastAPI demonstrator for Phase VI weather and Phase VII segmentation models"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "joblib>=1.4,<2",
  "scikit-learn==1.6.1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
ml = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "timm>=1.0.11,<2",
  "transformers>=4.45,<6",
  "safetensors>=0.4.5,<1",
]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
