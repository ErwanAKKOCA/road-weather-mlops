name: Deploy Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  API_APP: ${{ vars.AZURE_API_APP_NAME }}
  UI_APP: ${{ vars.AZURE_UI_APP_NAME }}
  CONTAINERAPPS_ENV: ${{ vars.AZURE_CONTAINERAPPS_ENV }}

  PHASE6_RELEASE: gs://thesis_weather_storage/phase6/releases/phase6_vkitti2_temporal_v4_1_release.tar.gz
  PHASE7_MASK2FORMER_RELEASE: gs://thesis_weather_storage/phase7/releases/mask2former_kitti_v1_release.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # ============================================================
      # 2. Authenticate GitHub -> Google Cloud using OIDC/WIF
      # ============================================================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: appr-495316
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: road-weather-deploy@appr-495316.iam.gserviceaccount.com

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      # ============================================================
      # 3. Download and materialize Phase VI release
      # ============================================================
      - name: Materialize checksummed Phase VI artifacts
        id: phase6
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backend/artifacts
          mkdir -p /tmp/phase6-extracted

          echo "Downloading Phase VI release..."

          gcloud storage cp \
            "$PHASE6_RELEASE" \
            /tmp/phase6-release.tar.gz

          echo "Archive contents:"
          tar -tzf /tmp/phase6-release.tar.gz | sed -n '1,100p'

          echo "Extracting Phase VI release..."

          tar -xzf \
            /tmp/phase6-release.tar.gz \
            -C /tmp/phase6-extracted

          echo "Extracted files:"
          find /tmp/phase6-extracted \
            -maxdepth 4 \
            -type f \
            | sort

          PHASE6_ROOT=$(find /tmp/phase6-extracted \
            -type f \
            -name "environment_v4_1.json" \
            -printf '%h\n' \
            -quit)

          if [ -z "$PHASE6_ROOT" ]; then
            echo "ERROR: environment_v4_1.json was not found."
            exit 1
          fi

          echo "Detected Phase VI artifact root:"
          echo "$PHASE6_ROOT"

          cp -a "$PHASE6_ROOT"/. backend/artifacts/

          echo "Checking required Phase VI files..."

          required_files=(
            "dinov2_logistic_semantic_sky_v3_1.joblib"
            "region_definitions_v3_1.json"
            "environment_v4_1.json"
            "release_manifest_v4_1.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "backend/artifacts/$file" ]; then
              echo "ERROR: missing backend/artifacts/$file"
              exit 1
            fi

            echo "OK: backend/artifacts/$file"
          done

          echo "Reading locked dependency versions..."

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          versions = json.loads(
              Path("backend/artifacts/environment_v4_1.json").read_text()
          )

          print(
              f"sklearn_version="
              f"{versions['scikit_learn']}"
          )

          print(
              f"timm_version="
              f"{versions['timm']}"
          )

          print(
              f"torch_version="
              f"{versions['torch'].split('+')[0]}"
          )
          PY

      # ============================================================
      # 4. Download Mask2Former release
      # ============================================================
      - name: Materialize checksummed Mask2Former artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backend/artifacts

          echo "Downloading Mask2Former release..."

          gcloud storage cp \
            "$PHASE7_MASK2FORMER_RELEASE" \
            /tmp/mask2former-release.tar.gz

          echo "Extracting Mask2Former release..."

          tar -xzf \
            /tmp/mask2former-release.tar.gz \
            -C backend/artifacts

          echo "Checking Mask2Former files..."

          required_files=(
            "model.safetensors"
            "config.json"
            "preprocessor_config.json"
            "release_manifest.json"
          )

          for file in "${required_files[@]}"; do
            path="backend/artifacts/mask2former_kitti_best/$file"

            if [ ! -f "$path" ]; then
              echo "ERROR: missing $path"
              exit 1
            fi

            echo "OK: $path"
          done

      # ============================================================
      # 5. Validate SHA-256 manifests
      # ============================================================
      - name: Validate deployable artifact checksums
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_release.py \
            --artifacts artifacts

      # ============================================================
      # 6. Authenticate GitHub -> Azure using OIDC
      # ============================================================
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ============================================================
      # 7. Verify Azure infrastructure
      # ============================================================
      - name: Verify Azure deployment context
        shell: bash
        run: |
          set -euo pipefail

          echo "Resource group:"
          echo "$RESOURCE_GROUP"

          echo "Azure Container Registry:"
          echo "$ACR_NAME"

          echo "Container Apps environment:"
          echo "$CONTAINERAPPS_ENV"

          az group show \
            --name "$RESOURCE_GROUP" \
            --output none

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none

          az containerapp env show \
            --name "$CONTAINERAPPS_ENV" \
            --resource-group "$RESOURCE_GROUP" \
            --output none

      # ============================================================
      # 8. Build and push FastAPI backend image
      # ============================================================
      - name: Build and push API image
        id: api_image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "$ACR_NAME"

          image="$ACR_NAME.azurecr.io/phase7-weather-api:${DEPLOY_SHA}"

          docker build \
            --build-arg "SCIKIT_LEARN_VERSION=${{ steps.phase6.outputs.sklearn_version }}" \
            --build-arg "TIMM_VERSION=${{ steps.phase6.outputs.timm_version }}" \
            --build-arg "TORCH_VERSION=${{ steps.phase6.outputs.torch_version }}" \
            --build-arg "TORCHVISION_VERSION=0.26.0" \
            -t "$image" \
            backend

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. Deploy FastAPI backend with managed ACR pull identity
      # ============================================================
      - name: Deploy API
        shell: bash
        run: |
          set -euo pipefail

          PULL_ID=$(az identity show \
            --name road-weather-acr-pull \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            -o tsv)

          IMAGE="${{ steps.api_image.outputs.image }}"

          if az containerapp show \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then

            echo "Updating existing API..."

            az containerapp identity assign \
              --name "$API_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --user-assigned "$PULL_ID" \
              --output none

            az containerapp registry set \
              --name "$API_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --server "$ACR_NAME.azurecr.io" \
              --identity "$PULL_ID" \
              --output none

            az containerapp update \
              --name "$API_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                MODEL_MODE=phase6 \
                ARTIFACT_DIR=/artifacts \
                EMA_ALPHA=0.6 \
                DEFAULT_ABSTENTION_THRESHOLD=0.90 \
                LOGGING_ENABLED=true \
                SEGMENTATION_ENABLED=true \
                SEGMENTATION_MODEL_DIR=/artifacts/mask2former_kitti_best \
              --output none

            az containerapp ingress enable \
              --name "$API_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --type external \
              --target-port 8000 \
              --transport auto \
              --output none

          else

            echo "Creating API..."

            az containerapp create \
              --name "$API_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINERAPPS_ENV" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --user-assigned "$PULL_ID" \
              --registry-identity "$PULL_ID" \
              --registry-server "$ACR_NAME.azurecr.io" \
              --env-vars \
                MODEL_MODE=phase6 \
                ARTIFACT_DIR=/artifacts \
                EMA_ALPHA=0.6 \
                DEFAULT_ABSTENTION_THRESHOLD=0.90 \
                LOGGING_ENABLED=true \
                SEGMENTATION_ENABLED=true \
                SEGMENTATION_MODEL_DIR=/artifacts/mask2former_kitti_best \
              --output none
          fi

      # ============================================================
      # 10. Resolve backend public URL
      # ============================================================
      - name: Resolve API URL
        id: api
        shell: bash
        run: |
          set -euo pipefail

          fqdn=$(az containerapp show \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          if [ -z "$fqdn" ]; then
            echo "ERROR: API FQDN could not be resolved."
            exit 1
          fi

          echo "API FQDN:"
          echo "$fqdn"

          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Smoke-test backend
      # ============================================================
      - name: Smoke-test deployed API
        shell: bash
        run: |
          set -euo pipefail

          API_URL="${{ steps.api.outputs.url }}"

          echo "Waiting for API:"
          echo "$API_URL"

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "$API_URL/health/live"; then

              echo
              echo "API is alive."
              exit 0
            fi

            echo "Waiting for API startup ($i/30)..."
            sleep 10
          done

          echo "ERROR: API did not become alive."
          exit 1

      # ============================================================
      # 12. Build and push frontend
      # ============================================================
      - name: Build and push frontend
        id: frontend_image
        shell: bash
        run: |
          set -euo pipefail

          az acr login --name "$ACR_NAME"

          image="$ACR_NAME.azurecr.io/phase7-weather-ui:${DEPLOY_SHA}"

          echo "Building frontend with API URL:"
          echo "${{ steps.api.outputs.url }}"

          docker build \
            --build-arg "VITE_API_BASE_URL=${{ steps.api.outputs.url }}" \
            -t "$image" \
            frontend

          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 13. Deploy frontend with managed ACR pull identity
      # ============================================================
      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          PULL_ID=$(az identity show \
            --name road-weather-acr-pull \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            -o tsv)

          IMAGE="${{ steps.frontend_image.outputs.image }}"

          if az containerapp show \
            --name "$UI_APP" \
            --resource-group "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then

            echo "Updating existing frontend..."

            az containerapp identity assign \
              --name "$UI_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --user-assigned "$PULL_ID" \
              --output none

            az containerapp registry set \
              --name "$UI_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --server "$ACR_NAME.azurecr.io" \
              --identity "$PULL_ID" \
              --output none

            az containerapp update \
              --name "$UI_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --output none

            az containerapp ingress enable \
              --name "$UI_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --type external \
              --target-port 8080 \
              --transport auto \
              --output none

          else

            echo "Creating frontend..."

            az containerapp create \
              --name "$UI_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINERAPPS_ENV" \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --user-assigned "$PULL_ID" \
              --registry-identity "$PULL_ID" \
              --registry-server "$ACR_NAME.azurecr.io" \
              --output none
          fi
      # ============================================================
      # 14. Resolve frontend URL
      # ============================================================
      - name: Resolve frontend URL
        id: frontend
        shell: bash
        run: |
          set -euo pipefail

          ui_fqdn=$(az containerapp show \
            --name "$UI_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          if [ -z "$ui_fqdn" ]; then
            echo "ERROR: frontend FQDN could not be resolved."
            exit 1
          fi

          echo "Frontend FQDN:"
          echo "$ui_fqdn"

          echo "url=https://$ui_fqdn" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 15. Configure CORS and preserve EMA temporal state
      # ============================================================
      - name: Configure API runtime and single-replica EMA state
        shell: bash
        run: |
          set -euo pipefail

          UI_URL="${{ steps.frontend.outputs.url }}"

          echo "Configuring API CORS for:"
          echo "$UI_URL"

          az containerapp update \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              MODEL_MODE=phase6 \
              ARTIFACT_DIR=/artifacts \
              EMA_ALPHA=0.6 \
              DEFAULT_ABSTENTION_THRESHOLD=0.90 \
              LOGGING_ENABLED=true \
              SEGMENTATION_ENABLED=true \
              SEGMENTATION_MODEL_DIR=/artifacts/mask2former_kitti_best \
              "CORS_ORIGINS=$UI_URL" \
            --min-replicas 1 \
            --max-replicas 1 \
            --output none

      # ============================================================
      # 16. Final model readiness test
      # ============================================================
      - name: Final API readiness test
        shell: bash
        run: |
          set -euo pipefail

          API_URL="${{ steps.api.outputs.url }}"

          echo "Waiting for weather and segmentation models..."

          for i in {1..60}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "$API_URL/health/ready"; then

              echo
              echo "API reports READY."
              exit 0
            fi

            echo "Waiting for models ($i/60)..."
            sleep 10
          done

          echo "ERROR: API never became ready."
          exit 1

      # ============================================================
      # 17. Frontend smoke test
      # ============================================================
      - name: Frontend smoke test
        shell: bash
        run: |
          set -euo pipefail

          UI_URL="${{ steps.frontend.outputs.url }}"

          curl \
            --fail \
            --silent \
            --show-error \
            "$UI_URL" \
            > /dev/null

          echo "Frontend reachable."

      # ============================================================
      # 18. Deployment summary
      # ============================================================
      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Road Weather deployment"
            echo ""
            echo "### API"
            echo "${{ steps.api.outputs.url }}"
            echo ""
            echo "### Frontend"
            echo "${{ steps.frontend.outputs.url }}"
            echo ""
            echo "### Docker tag"
            echo "$DEPLOY_SHA"
            echo ""
            echo "### Deployment"
            echo "Azure Container Apps deployment completed."
          } >> "$GITHUB_STEP_SUMMARY"