name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install test dependencies
        working-directory: backend
        run: pip install ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts

      - name: Test
        working-directory: backend
        env:
          MODEL_MODE: mock
          SEGMENTATION_ENABLED: "false"
          LOGGING_ENABLED: "false"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build lightweight API image
        run: |
          docker build \
            --build-arg INSTALL_ML=false \
            -t road-weather-api:ci \
            backend

      - name: Start API in mock mode
        run: |
          docker run -d \
            --rm \
            --name road-weather-api-ci \
            -e MODEL_MODE=mock \
            -e SEGMENTATION_ENABLED=false \
            -e LOGGING_ENABLED=false \
            -p 8000:8000 \
            road-weather-api:ci

      - name: Smoke-test health endpoints
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/ready; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8000/health/live
          curl --fail http://localhost:8000/health/ready

      - name: Container logs on failure
        if: failure()
        run: docker logs road-weather-api-ci || true